[package]
name = "relay_core"
version = "0.1.0"
edition = "2021"
description = "Speed-critical kernels for the AlgoMaschine walk-forward engine"

[lib]
name = "relay_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.25.1", features = ["extension-module", "abi3-py311"] }
numpy = "=0.25.0"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
