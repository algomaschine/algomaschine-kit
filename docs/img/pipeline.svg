<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Pipeline: idea, data and QA, spec lock, review gate, walk-forward, report, audit">
<style>
.l{fill:none;stroke:#f4f5f6;stroke-linejoin:round;stroke-linecap:round}
.f{fill:#f4f5f6;stroke:none} .g{fill:#d2b469;stroke:none} .gl{fill:none;stroke:#d2b469;stroke-linejoin:round;stroke-linecap:round}
.eye{fill:#2a1038;stroke:#f4f5f6;stroke-width:6}
.b{fill:#c98a8a;stroke:none;opacity:.55}
.t{fill:none;stroke:#f4f5f6;stroke-linejoin:round;stroke-linecap:round;opacity:.55} .r{fill:#d98a94;stroke:none;opacity:.6}
</style><rect width="1280" height="360" fill="#0d0614" rx="18"/>
<text x="40" y="60" fill="#f4f5f6" font-family="Georgia,'Times New Roman',serif" font-size="34" font-weight="600">From idea to verdict in seven commands</text>
<text x="40" y="90" fill="#a9a0b5" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16">Gold borders are gates: the run stops there if the check fails.</text>
<rect x="15" y="120" width="158" height="170" rx="14" fill="#170b22" stroke="#d946ef" stroke-width="1.6"/><circle cx="94.0" cy="152" r="16" fill="none" stroke="#d946ef" stroke-width="2"/><text x="94.0" y="158" fill="#d946ef" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="16" text-anchor="middle">1</text><text x="94.0" y="206" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1" text-anchor="middle">IDEA</text><text x="94.0" y="234" fill="#d946ef" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="12.5" text-anchor="middle">IDEA.md</text><text x="94.0" y="262" fill="#a9a0b5" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">tell the kit how</text><text x="94.0" y="278" fill="#a9a0b5" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">the alpha is made</text><path d="M177 205 H193" stroke="#d946ef" stroke-width="2"/><path d="M188 200 L194 205 L188 210" fill="none" stroke="#d946ef" stroke-width="2"/><rect x="197" y="120" width="158" height="170" rx="14" fill="#170b22" stroke="#d946ef" stroke-width="1.6"/><circle cx="276.0" cy="152" r="16" fill="none" stroke="#d946ef" stroke-width="2"/><text x="276.0" y="158" fill="#d946ef" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="16" text-anchor="middle">2</text><text x="276.0" y="206" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1" text-anchor="middle">DATA + QA</text><text x="276.0" y="234" fill="#d946ef" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="12.5" text-anchor="middle">make data qa</text><text x="276.0" y="262" fill="#a9a0b5" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">EODHD bars,</text><text x="276.0" y="278" fill="#a9a0b5" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">clock check</text><path d="M359 205 H375" stroke="#d946ef" stroke-width="2"/><path d="M370 200 L376 205 L370 210" fill="none" stroke="#d946ef" stroke-width="2"/><rect x="379" y="120" width="158" height="170" rx="14" fill="#170b22" stroke="#d946ef" stroke-width="1.6"/><circle cx="458.0" cy="152" r="16" fill="none" stroke="#d946ef" stroke-width="2"/><text x="458.0" y="158" fill="#d946ef" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="16" text-anchor="middle">3</text><text x="458.0" y="206" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1" text-anchor="middle">SPEC LOCK</text><text x="458.0" y="234" fill="#d946ef" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="12.5" text-anchor="middle">make spec-lock</text><text x="458.0" y="262" fill="#a9a0b5" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">pre-register, then</text><text x="458.0" y="278" fill="#a9a0b5" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">freeze</text><path d="M541 205 H557" stroke="#d946ef" stroke-width="2"/><path d="M552 200 L558 205 L552 210" fill="none" stroke="#d946ef" stroke-width="2"/><rect x="561" y="120" width="158" height="170" rx="14" fill="#170b22" stroke="#d2b469" stroke-width="1.6"/><circle cx="640.0" cy="152" r="16" fill="none" stroke="#d2b469" stroke-width="2"/><text x="640.0" y="158" fill="#d2b469" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="16" text-anchor="middle">4</text><text x="640.0" y="206" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1" text-anchor="middle">REVIEW</text><text x="640.0" y="234" fill="#d2b469" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="12.5" text-anchor="middle">make review</text><text x="640.0" y="262" fill="#a9a0b5" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">gate before</text><text x="640.0" y="278" fill="#a9a0b5" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">real data</text><path d="M723 205 H739" stroke="#d946ef" stroke-width="2"/><path d="M734 200 L740 205 L734 210" fill="none" stroke="#d946ef" stroke-width="2"/><rect x="743" y="120" width="158" height="170" rx="14" fill="#170b22" stroke="#d946ef" stroke-width="1.6"/><circle cx="822.0" cy="152" r="16" fill="none" stroke="#d946ef" stroke-width="2"/><text x="822.0" y="158" fill="#d946ef" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="16" text-anchor="middle">5</text><text x="822.0" y="206" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1" text-anchor="middle">WALK-FORWARD</text><text x="822.0" y="234" fill="#d946ef" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="12.5" text-anchor="middle">make walkforward</text><text x="822.0" y="262" fill="#a9a0b5" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">auto-calibrated, out</text><text x="822.0" y="278" fill="#a9a0b5" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">of sample</text><path d="M905 205 H921" stroke="#d946ef" stroke-width="2"/><path d="M916 200 L922 205 L916 210" fill="none" stroke="#d946ef" stroke-width="2"/><rect x="925" y="120" width="158" height="170" rx="14" fill="#170b22" stroke="#d946ef" stroke-width="1.6"/><circle cx="1004.0" cy="152" r="16" fill="none" stroke="#d946ef" stroke-width="2"/><text x="1004.0" y="158" fill="#d946ef" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="16" text-anchor="middle">6</text><text x="1004.0" y="206" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1" text-anchor="middle">REPORT</text><text x="1004.0" y="234" fill="#d946ef" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="12.5" text-anchor="middle">make report serve</text><text x="1004.0" y="262" fill="#a9a0b5" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">PBO, CPCV,</text><text x="1004.0" y="278" fill="#a9a0b5" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">deflated Sharpe</text><path d="M1087 205 H1103" stroke="#d946ef" stroke-width="2"/><path d="M1098 200 L1104 205 L1098 210" fill="none" stroke="#d946ef" stroke-width="2"/><rect x="1107" y="120" width="158" height="170" rx="14" fill="#170b22" stroke="#d2b469" stroke-width="1.6"/><circle cx="1186.0" cy="152" r="16" fill="none" stroke="#d2b469" stroke-width="2"/><text x="1186.0" y="158" fill="#d2b469" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="16" text-anchor="middle">7</text><text x="1186.0" y="206" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1" text-anchor="middle">AUDIT</text><text x="1186.0" y="234" fill="#d2b469" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="12.5" text-anchor="middle">make audit</text><text x="1186.0" y="262" fill="#a9a0b5" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">too good to</text><text x="1186.0" y="278" fill="#a9a0b5" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">be true?</text>
<text x="1240" y="336" fill="#a9a0b5" font-family="'Helvetica Neue',Arial,sans-serif" font-size="14" text-anchor="end">Every configuration you try is counted as a trial, forever.</text>
<svg x="26" y="300" width="40" height="46" viewBox="96 36 808 928">
  
  <!-- frame: the hexagon of the AlgoMaschine emblem -->
  <g class="l" stroke-width="17"><polygon points="500,50 890,275 890,725 500,950 110,725 110,275"/></g>
  <g class="l" stroke-width="9"><polygon points="500,80 860,290 860,710 500,920 140,710 140,290"/></g>

  <!-- COMPASS: two tapered legs from the hinge, needle on the left, pencil on the right, arc bar -->
  <g>
    <path class="l" stroke-width="15" d="M486,640 L382,796 M514,640 L618,796"/>
    <path class="gl" stroke-width="4" d="M488,664 L402,790 M512,664 L598,790" opacity=".9"/>
    <!-- needle (left): a fine steel point -->
    <path class="f" d="M372,790 L394,802 L372,836 Z"/>
    <!-- pencil holder (right): a clamp and a golden lead -->
    <path class="l" stroke-width="8" d="M602,774 L634,792"/>
    <path class="g" d="M620,796 L640,784 L632,834 Z"/>
    <!-- arc bar joining the legs -->
    <path class="l" stroke-width="7" d="M424,744 Q500,708 576,744"/>
    <circle class="g" cx="424" cy="744" r="8"/><circle class="g" cx="576" cy="744" r="8"/>
    <!-- the circle the pencil draws -->
    <path class="gl" stroke-width="9" stroke-dasharray="0 22" d="M418,852 L584,852"/>
  </g>

  <!-- NECK and chest ruff: leads into the hinge -->
    <path class="l" stroke-width="7" d="M452,534 L476,566 L500,540 L524,566 L548,534"/><path class="l" stroke-width="7" d="M500,540 L500,584"/>
  <!-- HINGE: ring and screw -->
  <circle class="l" stroke-width="12" cx="500" cy="612" r="31"/>
  <circle class="g" cx="500" cy="612" r="10"/>

  <!-- FOX HEAD, scaled so the compass reads clearly -->
  <g transform="translate(500 345) scale(.82) translate(-500 -345)">
    <!-- ears -->
    <path class="l" stroke-width="12" d="M340,305 L352,128 L452,246"/>
    <path class="l" stroke-width="12" d="M660,305 L648,128 L548,246"/>
    <path class="g" d="M358,262 L362,172 L424,244 Z"/>
    <path class="g" d="M642,262 L638,172 L576,244 Z"/>
    <!-- head: faceted, with cheek tufts -->
    <path class="l" stroke-width="12" d="M340,305 L452,246 Q500,232 548,246 L660,305 L688,382 L716,428 L664,434 L640,484 L574,520 L500,556 L426,520 L360,484 L336,434 L284,428 L312,382 Z"/>
    <!-- facets -->
    <path class="t" stroke-width="5" d="M452,246 L500,318 L548,246 M500,318 L500,508 M340,305 L420,398 M660,305 L580,398"/>
    <!-- muzzle -->
    <path class="t" stroke-width="5" d="M426,520 L470,470 L500,500 L530,470 L574,520"/>
    <!-- eyes: almond, upswept, with lashes -->
    <path class="f" d="M384,398 Q424,376 468,412 Q424,430 384,398 Z"/>
    <path class="f" d="M616,398 Q576,376 532,412 Q576,430 616,398 Z"/>
    <circle class="g" cx="436" cy="404" r="12"/><circle class="g" cx="564" cy="404" r="12"/>
    <circle fill="#fff" cx="441" cy="399" r="4.5"/><circle fill="#fff" cx="569" cy="399" r="4.5"/>
    <path class="l" stroke-width="8" d="M384,398 L364,384 M392,390 L376,372 M616,398 L636,384 M608,390 L624,372"/>
    <path class="l" stroke-width="8" d="M388,394 Q424,370 470,410 M612,394 Q576,370 530,410"/>
    <!-- nose and a small smile -->
    <path class="f" d="M480,520 L520,520 L500,546 Z"/>
        <!-- blush -->
    <ellipse class="r" cx="396" cy="450" rx="30" ry="13"/><ellipse class="r" cx="604" cy="450" rx="30" ry="13"/>
    <!-- whiskers -->
    <path class="gl" stroke-width="3.5" d="M330,470 L268,462 M334,494 L276,504 M670,470 L732,462 M666,494 L724,504" opacity=".85"/>
  </g>
</svg>
</svg>