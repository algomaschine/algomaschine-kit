<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Pipeline: idea, data and QA, spec lock, review gate, walk-forward, report, audit">
<style>
:root{--ink:#f4f5f6;--gold:#c2a25a;--fux:#e3c777;--eye:#15171a}
.p{fill:#e3c777;stroke:none} .pl{fill:none;stroke:#e3c777;stroke-linecap:round;stroke-linejoin:round} .w{fill:none;stroke:#fff;stroke-linecap:round}
.eye{fill:#15171a;stroke:#f4f5f6;stroke-width:6}
.l{fill:none;stroke:#f4f5f6;stroke-linejoin:round;stroke-linecap:round}
.f{fill:#f4f5f6;stroke:none} .g{fill:#d2b469;stroke:none} .gl{fill:none;stroke:#d2b469;stroke-linejoin:round;stroke-linecap:round}
.eye{fill:#15171a;stroke:#f4f5f6;stroke-width:6}
.b{fill:#c98a8a;stroke:none;opacity:.55}
.t{fill:none;stroke:#f4f5f6;stroke-linejoin:round;stroke-linecap:round;opacity:.55} .r{fill:#d98a94;stroke:none;opacity:.6}
</style><rect width="1280" height="360" fill="#14161a" rx="18"/>
<text x="40" y="60" fill="#f4f5f6" font-family="Georgia,'Times New Roman',serif" font-size="34" font-weight="600">From idea to verdict in seven commands</text>
<text x="40" y="90" fill="#a9aeb6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16">Gold borders are gates: the run stops there if the check fails.</text>
<rect x="15" y="120" width="158" height="170" rx="14" fill="#1b1e22" stroke="#8d939c" stroke-width="1.6"/><circle cx="94.0" cy="152" r="16" fill="none" stroke="#8d939c" stroke-width="2"/><text x="94.0" y="158" fill="#8d939c" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="16" text-anchor="middle">1</text><text x="94.0" y="206" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1" text-anchor="middle">IDEA</text><text x="94.0" y="234" fill="#8d939c" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="12.5" text-anchor="middle">IDEA.md</text><text x="94.0" y="262" fill="#a9aeb6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">tell the kit how</text><text x="94.0" y="278" fill="#a9aeb6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">the alpha is made</text><path d="M177 205 H193" stroke="#8d939c" stroke-width="2"/><path d="M188 200 L194 205 L188 210" fill="none" stroke="#8d939c" stroke-width="2"/><rect x="197" y="120" width="158" height="170" rx="14" fill="#1b1e22" stroke="#8d939c" stroke-width="1.6"/><circle cx="276.0" cy="152" r="16" fill="none" stroke="#8d939c" stroke-width="2"/><text x="276.0" y="158" fill="#8d939c" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="16" text-anchor="middle">2</text><text x="276.0" y="206" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1" text-anchor="middle">DATA + QA</text><text x="276.0" y="234" fill="#8d939c" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="12.5" text-anchor="middle">make data qa</text><text x="276.0" y="262" fill="#a9aeb6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">EODHD bars,</text><text x="276.0" y="278" fill="#a9aeb6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">clock check</text><path d="M359 205 H375" stroke="#8d939c" stroke-width="2"/><path d="M370 200 L376 205 L370 210" fill="none" stroke="#8d939c" stroke-width="2"/><rect x="379" y="120" width="158" height="170" rx="14" fill="#1b1e22" stroke="#8d939c" stroke-width="1.6"/><circle cx="458.0" cy="152" r="16" fill="none" stroke="#8d939c" stroke-width="2"/><text x="458.0" y="158" fill="#8d939c" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="16" text-anchor="middle">3</text><text x="458.0" y="206" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1" text-anchor="middle">SPEC LOCK</text><text x="458.0" y="234" fill="#8d939c" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="12.5" text-anchor="middle">make spec-lock</text><text x="458.0" y="262" fill="#a9aeb6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">pre-register, then</text><text x="458.0" y="278" fill="#a9aeb6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">freeze</text><path d="M541 205 H557" stroke="#8d939c" stroke-width="2"/><path d="M552 200 L558 205 L552 210" fill="none" stroke="#8d939c" stroke-width="2"/><rect x="561" y="120" width="158" height="170" rx="14" fill="#1b1e22" stroke="#d2b469" stroke-width="1.6"/><circle cx="640.0" cy="152" r="16" fill="none" stroke="#d2b469" stroke-width="2"/><text x="640.0" y="158" fill="#d2b469" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="16" text-anchor="middle">4</text><text x="640.0" y="206" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1" text-anchor="middle">REVIEW</text><text x="640.0" y="234" fill="#d2b469" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="12.5" text-anchor="middle">make review</text><text x="640.0" y="262" fill="#a9aeb6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">gate before</text><text x="640.0" y="278" fill="#a9aeb6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">real data</text><path d="M723 205 H739" stroke="#8d939c" stroke-width="2"/><path d="M734 200 L740 205 L734 210" fill="none" stroke="#8d939c" stroke-width="2"/><rect x="743" y="120" width="158" height="170" rx="14" fill="#1b1e22" stroke="#8d939c" stroke-width="1.6"/><circle cx="822.0" cy="152" r="16" fill="none" stroke="#8d939c" stroke-width="2"/><text x="822.0" y="158" fill="#8d939c" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="16" text-anchor="middle">5</text><text x="822.0" y="206" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1" text-anchor="middle">WALK-FORWARD</text><text x="822.0" y="234" fill="#8d939c" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="12.5" text-anchor="middle">make walkforward</text><text x="822.0" y="262" fill="#a9aeb6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">auto-calibrated, out</text><text x="822.0" y="278" fill="#a9aeb6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">of sample</text><path d="M905 205 H921" stroke="#8d939c" stroke-width="2"/><path d="M916 200 L922 205 L916 210" fill="none" stroke="#8d939c" stroke-width="2"/><rect x="925" y="120" width="158" height="170" rx="14" fill="#1b1e22" stroke="#8d939c" stroke-width="1.6"/><circle cx="1004.0" cy="152" r="16" fill="none" stroke="#8d939c" stroke-width="2"/><text x="1004.0" y="158" fill="#8d939c" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="16" text-anchor="middle">6</text><text x="1004.0" y="206" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1" text-anchor="middle">REPORT</text><text x="1004.0" y="234" fill="#8d939c" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="12.5" text-anchor="middle">make report serve</text><text x="1004.0" y="262" fill="#a9aeb6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">PBO, CPCV,</text><text x="1004.0" y="278" fill="#a9aeb6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">deflated Sharpe</text><path d="M1087 205 H1103" stroke="#8d939c" stroke-width="2"/><path d="M1098 200 L1104 205 L1098 210" fill="none" stroke="#8d939c" stroke-width="2"/><rect x="1107" y="120" width="158" height="170" rx="14" fill="#1b1e22" stroke="#d2b469" stroke-width="1.6"/><circle cx="1186.0" cy="152" r="16" fill="none" stroke="#d2b469" stroke-width="2"/><text x="1186.0" y="158" fill="#d2b469" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="16" text-anchor="middle">7</text><text x="1186.0" y="206" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1" text-anchor="middle">AUDIT</text><text x="1186.0" y="234" fill="#d2b469" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="12.5" text-anchor="middle">make audit</text><text x="1186.0" y="262" fill="#a9aeb6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">too good to</text><text x="1186.0" y="278" fill="#a9aeb6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="middle">be true?</text>
<text x="1240" y="336" fill="#a9aeb6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="14" text-anchor="end">Every configuration you try is counted as a trial, forever.</text>
<svg x="26" y="300" width="40" height="46" viewBox="96 36 808 928">
  
  <!-- frame: the hexagon of the AlgoMaschine emblem -->
  <g class="l" stroke-width="17"><polygon points="500,50 890,275 890,725 500,950 110,725 110,275"/></g>
  <g class="l" stroke-width="9"><polygon points="500,80 860,290 860,710 500,920 140,710 140,290"/></g>

  <!-- tail: fluffy, curling up on the left, gold tip -->
  <path class="l" stroke-width="12" d="M415,790 C290,815 205,740 235,620 C248,575 292,570 302,606 C296,665 335,715 410,730"/>
  <path class="g" d="M235,620 C240,585 272,566 302,606 C282,606 258,612 235,620 Z"/>
  <path class="l" stroke-width="6" d="M262,690 C280,712 310,722 340,724" opacity=".6"/>

  <!-- body, sitting -->
  <path class="l" stroke-width="12" d="M418,610 C372,690 375,770 425,800 L575,800 C625,770 628,690 582,610"/>
  <path class="l" stroke-width="6" d="M470,640 L500,715 L530,640" opacity=".7"/>
  <!-- left paw down -->
  <path class="l" stroke-width="10" d="M455,720 L452,795"/>
  <ellipse class="l" stroke-width="10" cx="452" cy="800" rx="34" ry="14"/>
  <!-- right foot -->
  <ellipse class="l" stroke-width="10" cx="560" cy="800" rx="34" ry="14"/>

  <!-- the ring the compass draws: vivid dots around the whole scene -->
  <circle class="pl" stroke-width="13" stroke-dasharray="0 36" cx="500" cy="500" r="330"/>

  <!-- COMPASS: bright gold legs, fuchsia hinge and arc bar, steel needle, pencil -->
  <path class="pl" stroke-width="12" d="M730,388 L730,358"/><circle class="p" cx="730" cy="346" r="13"/>
  <path d="M716,450 L738,452 L690,744 L664,738 Z" fill="var(--gold)" stroke="var(--ink)" stroke-width="7" stroke-linejoin="round"/>
  <path d="M722,452 L744,450 L796,738 L770,744 Z" fill="var(--gold)" stroke="var(--ink)" stroke-width="7" stroke-linejoin="round"/>
  <path class="w" stroke-width="5" d="M720,470 L690,700 M742,470 L784,700" opacity=".85"/>
  <path class="pl" stroke-width="10" d="M692,612 Q731,578 770,612"/>
  <circle class="p" cx="692" cy="612" r="10"/><circle class="p" cx="770" cy="612" r="10"/>
  <path class="f" d="M657,736 L686,744 L668,792 Z"/>
  <path class="pl" stroke-width="12" d="M768,722 L800,730"/>
  <path class="p" d="M771,742 L798,736 L788,790 Z"/>
  <circle class="l" stroke-width="11" cx="731" cy="420" r="34"/>
  <circle class="p" cx="731" cy="420" r="13"/>
  <!-- the arm reaches up to the ring -->
  <path class="l" stroke-width="11" d="M588,655 C626,640 668,560 696,452"/>
  <circle class="l" stroke-width="10" cx="702" cy="452" r="17"/>

  <!-- ears -->
  <path class="l" stroke-width="12" d="M352,398 C340,330 335,290 330,248 C385,272 430,305 462,345"/>
  <path class="l" stroke-width="12" d="M648,398 C660,330 665,290 670,248 C615,272 570,305 538,345"/>
  <path class="g" d="M356,372 C350,330 346,300 346,282 C380,298 408,318 428,342 C400,350 376,360 356,372 Z"/>
  <path class="g" d="M644,372 C650,330 654,300 654,282 C620,298 592,318 572,342 C600,350 624,360 644,372 Z"/>

  <!-- head: round, with cheek tufts -->
  <path class="l" stroke-width="12" d="M330,495 C322,400 402,340 500,340 C598,340 678,400 670,495 L700,520 L668,534 L688,562 C650,610 580,626 500,626 C420,626 350,610 312,562 L332,534 L300,520 Z"/>

  <!-- eyes: left wide open and sparkling, right winking; lashes -->
  <ellipse class="eye" cx="428" cy="485" rx="34" ry="44"/>
  <circle fill="#fff" cx="440" cy="466" r="12"/><circle fill="#fff" cx="418" cy="506" r="6"/>
  <path class="l" stroke-width="9" d="M395,452 L376,436 M394,472 L372,468"/>
  <path class="l" stroke-width="11" d="M538,492 Q572,452 606,492"/>
  <path class="l" stroke-width="9" d="M612,478 L630,462"/>
  <!-- nose and mouth -->
  <path class="f" d="M488,534 Q500,526 512,534 Q508,546 500,550 Q492,546 488,534 Z"/>
  <path class="l" stroke-width="8" d="M500,552 L500,562 M500,562 Q486,578 470,566 M500,562 Q514,578 530,566"/>
  <!-- blush -->
  <ellipse class="b" cx="386" cy="552" rx="30" ry="15"/>
  <ellipse class="b" cx="614" cy="552" rx="30" ry="15"/>

</svg>
