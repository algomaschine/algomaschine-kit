<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="AlgoMaschine Kit: walk-forward backtesting for quantitative trading">
<style>
.l{fill:none;stroke:#f4f5f6;stroke-linejoin:round;stroke-linecap:round}
.f{fill:#f4f5f6;stroke:none} .g{fill:#d2b469;stroke:none} .gl{fill:none;stroke:#d2b469;stroke-linejoin:round;stroke-linecap:round}
.eye{fill:#2a1038;stroke:#f4f5f6;stroke-width:6}
.b{fill:#c98a8a;stroke:none;opacity:.55}
.t{fill:none;stroke:#f4f5f6;stroke-linejoin:round;stroke-linecap:round;opacity:.55} .r{fill:#d98a94;stroke:none;opacity:.6}
</style><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#d946ef" stop-opacity=".35"/><stop offset="1" stop-color="#d946ef" stop-opacity="0"/></radialGradient></defs>
<rect width="1280" height="400" fill="#0d0614"/>
<circle cx="260" cy="200" r="230" fill="url(#halo)"/>
<path d="M0 372 H1280" stroke="#3a1f4d" stroke-width="1"/>
<g stroke="#d946ef" stroke-opacity=".18" fill="none"><path d="M470 60 H1220 M470 340 H1220"/></g>
<svg x="110" y="22" width="300" height="356" viewBox="96 36 808 928">
  
  <!-- frame: the hexagon of the AlgoMaschine emblem -->
  <g class="l" stroke-width="17"><polygon points="500,50 890,275 890,725 500,950 110,725 110,275"/></g>
  <g class="l" stroke-width="9"><polygon points="500,80 860,290 860,710 500,920 140,710 140,290"/></g>

  <!-- COMPASS: two tapered legs from the hinge, needle on the left, pencil on the right, arc bar -->
  <g>
    <path class="l" stroke-width="15" d="M486,640 L382,796 M514,640 L618,796"/>
    <path class="gl" stroke-width="4" d="M488,664 L402,790 M512,664 L598,790" opacity=".9"/>
    <!-- needle (left): a fine steel point -->
    <path class="f" d="M372,790 L394,802 L372,836 Z"/>
    <!-- pencil holder (right): a clamp and a golden lead -->
    <path class="l" stroke-width="8" d="M602,774 L634,792"/>
    <path class="g" d="M620,796 L640,784 L632,834 Z"/>
    <!-- arc bar joining the legs -->
    <path class="l" stroke-width="7" d="M424,744 Q500,708 576,744"/>
    <circle class="g" cx="424" cy="744" r="8"/><circle class="g" cx="576" cy="744" r="8"/>
    <!-- the circle the pencil draws -->
    <path class="gl" stroke-width="9" stroke-dasharray="0 22" d="M418,852 L584,852"/>
  </g>

  <!-- NECK and chest ruff: leads into the hinge -->
    <path class="l" stroke-width="7" d="M452,534 L476,566 L500,540 L524,566 L548,534"/><path class="l" stroke-width="7" d="M500,540 L500,584"/>
  <!-- HINGE: ring and screw -->
  <circle class="l" stroke-width="12" cx="500" cy="612" r="31"/>
  <circle class="g" cx="500" cy="612" r="10"/>

  <!-- FOX HEAD, scaled so the compass reads clearly -->
  <g transform="translate(500 345) scale(.82) translate(-500 -345)">
    <!-- ears -->
    <path class="l" stroke-width="12" d="M340,305 L352,128 L452,246"/>
    <path class="l" stroke-width="12" d="M660,305 L648,128 L548,246"/>
    <path class="g" d="M358,262 L362,172 L424,244 Z"/>
    <path class="g" d="M642,262 L638,172 L576,244 Z"/>
    <!-- head: faceted, with cheek tufts -->
    <path class="l" stroke-width="12" d="M340,305 L452,246 Q500,232 548,246 L660,305 L688,382 L716,428 L664,434 L640,484 L574,520 L500,556 L426,520 L360,484 L336,434 L284,428 L312,382 Z"/>
    <!-- facets -->
    <path class="t" stroke-width="5" d="M452,246 L500,318 L548,246 M500,318 L500,508 M340,305 L420,398 M660,305 L580,398"/>
    <!-- muzzle -->
    <path class="t" stroke-width="5" d="M426,520 L470,470 L500,500 L530,470 L574,520"/>
    <!-- eyes: almond, upswept, with lashes -->
    <path class="f" d="M384,398 Q424,376 468,412 Q424,430 384,398 Z"/>
    <path class="f" d="M616,398 Q576,376 532,412 Q576,430 616,398 Z"/>
    <circle class="g" cx="436" cy="404" r="12"/><circle class="g" cx="564" cy="404" r="12"/>
    <circle fill="#fff" cx="441" cy="399" r="4.5"/><circle fill="#fff" cx="569" cy="399" r="4.5"/>
    <path class="l" stroke-width="8" d="M384,398 L364,384 M392,390 L376,372 M616,398 L636,384 M608,390 L624,372"/>
    <path class="l" stroke-width="8" d="M388,394 Q424,370 470,410 M612,394 Q576,370 530,410"/>
    <!-- nose and a small smile -->
    <path class="f" d="M480,520 L520,520 L500,546 Z"/>
        <!-- blush -->
    <ellipse class="r" cx="396" cy="450" rx="30" ry="13"/><ellipse class="r" cx="604" cy="450" rx="30" ry="13"/>
    <!-- whiskers -->
    <path class="gl" stroke-width="3.5" d="M330,470 L268,462 M334,494 L276,504 M670,470 L732,462 M666,494 L724,504" opacity=".85"/>
  </g>
</svg>
<text x="470" y="150" fill="#f4f5f6" font-family="Georgia,'Times New Roman',serif" font-size="76" font-weight="600">AlgoMaschine Kit</text>
<text x="472" y="198" fill="#d2b469" font-family="'Helvetica Neue',Arial,sans-serif" font-size="22" letter-spacing="6">BACKTESTING THAT TELLS THE TRUTH</text>
<text x="472" y="238" fill="#a9a0b5" font-family="'Helvetica Neue',Arial,sans-serif" font-size="20">Walk-forward research for quantitative trading, with a fox that checks your math.</text>
<rect x="470" y="268" width="135" height="34" rx="17" fill="none" stroke="#d946ef" stroke-width="1.5"/><text x="537.5" y="290" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="14" letter-spacing="1.5" text-anchor="middle">PURGED CV</text><rect x="617" y="268" width="80" height="34" rx="17" fill="none" stroke="#d946ef" stroke-width="1.5"/><text x="657.0" y="290" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="14" letter-spacing="1.5" text-anchor="middle">CPCV</text><rect x="709" y="268" width="201" height="34" rx="17" fill="none" stroke="#d946ef" stroke-width="1.5"/><text x="809.5" y="290" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="14" letter-spacing="1.5" text-anchor="middle">DEFLATED SHARPE</text><rect x="922" y="268" width="69" height="34" rx="17" fill="none" stroke="#d946ef" stroke-width="1.5"/><text x="956.5" y="290" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="14" letter-spacing="1.5" text-anchor="middle">PBO</text><rect x="1003" y="268" width="190" height="34" rx="17" fill="none" stroke="#d946ef" stroke-width="1.5"/><text x="1098.0" y="290" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="14" letter-spacing="1.5" text-anchor="middle">BACKTEST AUDIT</text>
<text x="472" y="352" fill="#a9a0b5" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="15">make new NAME=my_idea &#160;·&#160; make walkforward &#160;·&#160; make audit</text>
</svg>