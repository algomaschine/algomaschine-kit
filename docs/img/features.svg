<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 530" width="1280" height="530" role="img" aria-label="What is inside the kit">
<style>
.l{fill:none;stroke:#f4f5f6;stroke-linejoin:round;stroke-linecap:round}
.f{fill:#f4f5f6;stroke:none} .g{fill:#d2b469;stroke:none} .gl{fill:none;stroke:#d2b469;stroke-linejoin:round;stroke-linecap:round}
.eye{fill:#2a1038;stroke:#f4f5f6;stroke-width:6}
.b{fill:#c98a8a;stroke:none;opacity:.55}
</style><rect width="1280" height="530" fill="#0d0614" rx="18"/>
<text x="40" y="62" fill="#f4f5f6" font-family="Georgia,'Times New Roman',serif" font-size="34" font-weight="600">What is inside</text>
<text x="40" y="90" fill="#a9a0b5" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16">Everything a research project needs, in one repository.</text>
<rect x="40" y="110" width="285" height="170" rx="14" fill="#170b22" stroke="#3a1f4d" stroke-width="1.5"/><path d="M60 132 H100" stroke="#d946ef" stroke-width="3" stroke-linecap="round"/><text x="60" y="164" fill="#d2b469" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">DATA</text><text x="60" y="192" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">EODHD daily and chunked,</text><text x="60" y="214" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">resumable 1-minute bars</text><text x="60" y="236" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">resampled to 5 minutes, with a</text><text x="60" y="258" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">clock QA gate.</text><rect x="345" y="110" width="285" height="170" rx="14" fill="#170b22" stroke="#3a1f4d" stroke-width="1.5"/><path d="M365 132 H405" stroke="#d946ef" stroke-width="3" stroke-linecap="round"/><text x="365" y="164" fill="#d2b469" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">VALIDATION</text><text x="365" y="192" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">Purged k-fold with embargo,</text><text x="365" y="214" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">CPCV, triple barrier, FFD, bet</text><text x="365" y="236" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">sizing, PSR, DSR, PBO.</text><rect x="650" y="110" width="285" height="170" rx="14" fill="#170b22" stroke="#3a1f4d" stroke-width="1.5"/><path d="M670 132 H710" stroke="#d946ef" stroke-width="3" stroke-linecap="round"/><text x="670" y="164" fill="#d2b469" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">ENGINE</text><text x="670" y="192" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">Auto-calibrated walk-forward.</text><text x="670" y="214" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">10% vol target, 2x cap, costs on</text><text x="670" y="236" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">every position change.</text><rect x="955" y="110" width="285" height="170" rx="14" fill="#170b22" stroke="#3a1f4d" stroke-width="1.5"/><path d="M975 132 H1015" stroke="#d946ef" stroke-width="3" stroke-linecap="round"/><text x="975" y="164" fill="#d2b469" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">REVIEW GATE</text><text x="975" y="192" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">Causality, purging, timing,</text><text x="975" y="214" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">sign-flip null and a planted t≈5</text><text x="975" y="236" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">effect, before real data.</text><rect x="40" y="300" width="285" height="170" rx="14" fill="#170b22" stroke="#3a1f4d" stroke-width="1.5"/><path d="M60 322 H100" stroke="#d946ef" stroke-width="3" stroke-linecap="round"/><text x="60" y="354" fill="#d2b469" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">FORENSIC AUDIT</text><text x="60" y="382" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">Luck, search, market, look-ahead</text><text x="60" y="404" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">and fragility checks on any</text><text x="60" y="426" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">backtest result.</text><rect x="345" y="300" width="285" height="170" rx="14" fill="#170b22" stroke="#3a1f4d" stroke-width="1.5"/><path d="M365 322 H405" stroke="#d946ef" stroke-width="3" stroke-linecap="round"/><text x="365" y="354" fill="#d2b469" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">DASHBOARD</text><text x="365" y="382" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">Results, Audit and Method pages</text><text x="365" y="404" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">with plain-English notes on</text><text x="365" y="426" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">every chart.</text><rect x="650" y="300" width="285" height="170" rx="14" fill="#170b22" stroke="#3a1f4d" stroke-width="1.5"/><path d="M670 322 H710" stroke="#d946ef" stroke-width="3" stroke-linecap="round"/><text x="670" y="354" fill="#d2b469" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">RUST ACCELERATOR</text><text x="670" y="382" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">Optional PyO3 kernels, identical</text><text x="670" y="404" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">results, ×280–640 faster on</text><text x="670" y="426" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">loops.</text><rect x="955" y="300" width="285" height="170" rx="14" fill="#170b22" stroke="#3a1f4d" stroke-width="1.5"/><path d="M975 322 H1015" stroke="#d946ef" stroke-width="3" stroke-linecap="round"/><text x="975" y="354" fill="#d2b469" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">CLAUDE CODE SKILLS</text><text x="975" y="382" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">Six skills, from idea to system</text><text x="975" y="404" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">to audit, installed with one</text><text x="975" y="426" fill="#f4f5f6" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">make target.</text>

</svg>