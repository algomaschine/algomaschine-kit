<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Realistic Multi-Layer Neon Glow Filter -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <!-- Outer wide blur (The ambient light) -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur1" />
      <!-- Middle blur (The tube glow) -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2" />
      <!-- Inner tight blur (The hot core edge) -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur3" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur3" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle text glow -->
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background to make the neon pop (Remove if you want transparent) -->
  <rect width="100%" height="100%" fill="#14161a" />

  <!-- Faint background bounding box from the original image -->
  <rect x="175" y="15" width="250" height="330" rx="4" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- ========================================== -->
  <!-- THE ICON: "The Circus inside the Hexagon"  -->
  <!-- ========================================== -->
  
  <!-- LAYER 1: The Neon Glow (Thick, colored, blurred) -->
  <g filter="url(#neon-glow)" stroke="#d2b469" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Outer Hexagon -->
    <polygon points="300,50 430,125 430,275 300,350 170,275 170,125" stroke-width="4" />
    <!-- Inner Hexagon (slightly inset) -->
    <polygon points="300,65 415,132 415,268 300,335 185,268 185,132" stroke-width="1.5" opacity="0.6" />

    <!-- Protractor / Top Arc Structure -->
    <path d="M 200,240 A 100,100 0 0,1 400,240" stroke-width="3" />
    <line x1="200" y1="240" x2="400" y2="240" stroke-width="2" />
    <!-- Protractor Ticks (using dasharray for simplicity, rotated) -->
    <path d="M 200,240 A 100,100 0 0,1 400,240" stroke-width="8" stroke-dasharray="2 8" opacity="0.8" />
    <path d="M 215,240 A 85,85 0 0,1 385,240" stroke-width="2" />

    <!-- Central Vertical Axis -->
    <line x1="300" y1="50" x2="300" y2="350" stroke-width="1.5" opacity="0.5" />

    <!-- The Compass (Drafting Tool) -->
    <!-- Top Hinge -->
    <circle cx="300" cy="120" r="15" stroke-width="3" />
    <circle cx="300" cy="120" r="5" fill="#d2b469" stroke="none" />
    
    <!-- Compass Legs (Thick main lines) -->
    <path d="M 300,135 L 235,310" stroke-width="5" />
    <path d="M 300,135 L 365,310" stroke-width="5" />
    
    <!-- Compass Knees/Joints -->
    <circle cx="267" cy="222" r="6" stroke-width="2" />
    <circle cx="333" cy="222" r="6" stroke-width="2" />
    
    <!-- Compass Crossbar -->
    <line x1="250" y1="200" x2="350" y2="200" stroke-width="3" />
    <line x1="260" y1="210" x2="340" y2="210" stroke-width="1.5" opacity="0.7" />

    <!-- Compass Tips -->
    <path d="M 235,310 L 225,335 L 240,315 Z" stroke-width="2" />
    <path d="M 365,310 L 375,335 L 360,315 Z" stroke-width="2" />

    <!-- Internal "Circus" Geometry (The busy details) -->
    <!-- Diagonal Crosshairs -->
    <line x1="220" y1="150" x2="380" y2="280" stroke-width="1" opacity="0.6" />
    <line x1="380" y1="150" x2="220" y2="280" stroke-width="1" opacity="0.6" />
    
    <!-- Concentric Circles / Arcs -->
    <circle cx="300" cy="200" r="60" stroke-width="1.5" opacity="0.5" />
    <circle cx="300" cy="200" r="90" stroke-width="1" opacity="0.3" />
    
    <!-- Bottom Arc Ticks -->
    <path d="M 220,280 A 80,80 0 0,0 380,280" stroke-width="6" stroke-dasharray="3 6" opacity="0.7" />
  </g>

  <!-- LAYER 2: The Neon Core (Thin, bright white/pink, crisp) -->
  <g stroke="#ffffff" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- Outer Hexagon Core -->
    <polygon points="300,50 430,125 430,275 300,350 170,275 170,125" stroke-width="1.5" />
    
    <!-- Protractor Core -->
    <path d="M 200,240 A 100,100 0 0,1 400,240" stroke-width="1.5" />
    <line x1="200" y1="240" x2="400" y2="240" stroke-width="1" />
    
    <!-- Compass Core -->
    <circle cx="300" cy="120" r="15" stroke-width="1.5" />
    <circle cx="300" cy="120" r="5" fill="#ffffff" stroke="none" />
    <path d="M 300,135 L 235,310" stroke-width="2" />
    <path d="M 300,135 L 365,310" stroke-width="2" />
    <circle cx="267" cy="222" r="6" stroke-width="1" />
    <circle cx="333" cy="222" r="6" stroke-width="1" />
    <line x1="250" y1="200" x2="350" y2="200" stroke-width="1.5" />
  </g>

  <!-- ========================================== -->
  <!-- THE TEXT: AlgoMaschine                     -->
  <!-- ========================================== -->
  <g filter="url(#text-glow)">
    <text x="300" y="410" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="300" fill="#ffffff" text-anchor="middle" letter-spacing="2">AlgoMaschine</text>
  </g>
  <!-- Text core for crispness -->
  <text x="300" y="410" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="300" fill="#ffffff" text-anchor="middle" letter-spacing="2" opacity="0.8">AlgoMaschine</text>

</svg>